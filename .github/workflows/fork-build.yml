name: fork build

on:
  workflow_dispatch:
  push:
    branches: [feat/upload-split-prune, feat/upload-album]

permissions:
  contents: write # publish the rolling release

env:
  # every branch has a rolling release of its own
  RELEASE: ${{ github.ref_name == 'feat/upload-album' && 'album' || 'split' }}

jobs:
  windows:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./app/up/... ./core/uploader/... ./pkg/rar5/...
      - name: Build tdl.exe
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          go build -trimpath \
            -ldflags "-s -w -X github.com/iyear/tdl/pkg/consts.Version=${RELEASE}-${GITHUB_SHA::7}" \
            -o tdl.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: tdl-windows-amd64
          path: tdl.exe
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${RELEASE}-latest"
          zip -j tdl_Windows_64bit.zip tdl.exe
          notes="Windows build of ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}: tdl up --split (RAR volumes streamed on the fly, no staging folder, no Rar.exe) / --split-size / --keep-volumes / --rm / --prune"
          if [ "$RELEASE" = album ]; then
            notes="$notes / --album (files in a row share one message, up to 10 each)"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            git tag -f "$tag" && git push -f origin "$tag"
            gh release edit "$tag" --notes "$notes" --prerelease
            gh release upload "$tag" tdl.exe tdl_Windows_64bit.zip --clobber
          else
            gh release create "$tag" tdl.exe tdl_Windows_64bit.zip \
              --target "$GITHUB_SHA" --title "tdl ${RELEASE} build" --notes "$notes" --prerelease
          fi
