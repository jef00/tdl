name: fork build

on:
  workflow_dispatch:
  push:
    branches: [feat/upload-split-prune]

permissions:
  contents: write # publish the rolling release

jobs:
  windows:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./app/up/... ./core/uploader/... ./pkg/rar5/...
      - name: Build tdl.exe
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          go build -trimpath \
            -ldflags "-s -w -X github.com/iyear/tdl/pkg/consts.Version=split-${GITHUB_SHA::7}" \
            -o tdl.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: tdl-windows-amd64
          path: tdl.exe
      - name: Publish release "split-latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip -j tdl_Windows_64bit.zip tdl.exe
          notes="Windows build of ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}: tdl up --split (RAR volumes streamed on the fly, no staging folder, no Rar.exe) / --split-size / --keep-volumes / --rm / --prune"
          if gh release view split-latest >/dev/null 2>&1; then
            git tag -f split-latest && git push -f origin split-latest
            gh release edit split-latest --notes "$notes" --prerelease
            gh release upload split-latest tdl.exe tdl_Windows_64bit.zip --clobber
          else
            gh release create split-latest tdl.exe tdl_Windows_64bit.zip \
              --target "$GITHUB_SHA" --title "tdl split build" --notes "$notes" --prerelease
          fi
